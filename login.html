<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أورو كادي</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 410px;
            border-radius: 20px;
            padding: 30px 25px 35px 25px;
            position: relative;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        /* زر الإغلاق X */
        .close-btn {
            position: absolute;
            top: 18px;
            left: 22px;
            font-size: 22px;
            color: #888888;
            text-decoration: none;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #333333;
        }

        /* اللوجو الدائري */
        .logo-container {
            width: 95px;
            height: 95px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            border: 3.5px solid #8b1832;
            padding: 3px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* العنوان اسم الماركة */
        .brand-title {
            font-size: 28px;
            font-weight: 700;
            color: #8b1832;
            margin: 0 0 4px 0;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #777777;
            margin: 0 0 25px 0;
        }

        /* التبويبات (إنشاء حساب / تسجيل الدخول) */
        .tabs-header {
            display: flex;
            border-bottom: 1.5px solid #e5e7eb;
            margin-bottom: 22px;
        }

        .tab-button {
            flex: 1;
            background: none;
            border: none;
            padding: 10px 0;
            font-size: 15px;
            font-weight: 700;
            color: #888888;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .tab-button.active {
            color: #8b1832;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -1.5px;
            right: 0;
            width: 100%;
            height: 3px;
            background-color: #8b1832;
            border-radius: 2px 2px 0 0;
        }

        /* رسائل التنبيه والخطأ */
        .msg-box {
            display: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .msg-box.error {
            display: block;
            background-color: #fde8e8;
            color: #e11d48;
            border: 1px solid #f87171;
        }
        .msg-box.success {
            display: block;
            background-color: #def7ec;
            color: #03543f;
            border: 1px solid #84e1bc;
        }

        /* حقول الإدخال */
        .form-group {
            margin-bottom: 14px;
        }

        .input-field {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #d1d5db;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            text-align: right;
            color: #333333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: #8b1832;
            box-shadow: 0 0 0 3px rgba(139, 24, 50, 0.1);
        }

        .input-field::placeholder {
            color: #9ca3af;
        }

        /* رابط نسيان كلمة السر */
        .forgot-pass-wrapper {
            text-align: right;
            margin-top: -4px;
            margin-bottom: 22px;
        }

        .forgot-pass-link {
            color: #8b1832;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-pass-link:hover {
            text-decoration: underline;
        }

        /* زر العنابي الأساسي */
        .btn-submit {
            width: 100%;
            background-color: #8b1832;
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #721328;
        }

        /* زر قوقل */
        .btn-google {
            width: 100%;
            background-color: #ffffff;
            color: #374151;
            border: 1.5px solid #d1d5db;
            padding: 11px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-google:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- زر الإغلاق والعودة -->
        <a href="index.html" class="close-btn" title="إغلاق">✕</a>
        
        <!-- اللوجو -->
        <div class="logo-container">
            <img src="images/Logen.jpeg" alt="أورو كادي" onerror="this.src='images/logo.jpeg'">
        </div>

        <!-- عناوين الماركة -->
        <h2 class="brand-title">أورو كادي</h2>
        <p class="brand-subtitle" id="sub-title-text">انشاء حساب جديد</p>

        <!-- التبويبات -->
        <div class="tabs-header">
            <button id="tab-signup" class="tab-button active" onclick="switchTab('signup')">انشاء حساب</button>
            <button id="tab-login" class="tab-button" onclick="switchTab('login')">تسجيل الدخول</button>
        </div>

        <!-- صندوق التنبيهات -->
        <div id="msg-box" class="msg-box"></div>

        <!-- نموذج تسجيل الدخول / إنشاء الحساب -->
        <form id="auth-form" onsubmit="handleAuthSubmit(event)">
            <div class="form-group">
                <input type="email" id="auth-email" placeholder="البريد الالكتروني" required class="input-field">
            </div>
            
            <div class="form-group">
                <input type="password" id="auth-password" placeholder="كلمة السر" required class="input-field">
            </div>

            <div class="forgot-pass-wrapper">
                <a href="#" class="forgot-pass-link">هل نسيت كلمة السر؟</a>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">انشاء الحساب</button>
        </form>

        <!-- زر تسجيل الدخول التلقائي عبر قوقل -->
        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>تسجيل الدخول عبر قوقل</span>
        </button>
    </div>

    <!-- برمجة التفاعل وقاعدة البيانات -->
    <script>
        let currentTab = 'signup';

        // التبديل بين التبويبات
        function switchTab(tab) {
            currentTab = tab;
            const signupBtn = document.getElementById('tab-signup');
            const loginBtn = document.getElementById('tab-login');
            const submitBtn = document.getElementById('submit-btn');
            const subTitle = document.getElementById('sub-title-text');
            const msgBox = document.getElementById('msg-box');
            msgBox.className = 'msg-box';

            if (tab === 'signup') {
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
                submitBtn.innerText = 'انشاء الحساب';
                subTitle.innerText = 'انشاء حساب جديد';
            } else {
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
                submitBtn.innerText = 'تسجيل الدخول';
                subTitle.innerText = 'تسجيل الدخول إلى حسابك';
            }
        }

        // حفظ البيانات في السيرفر وقاعدة البيانات SQLite عند الضغط على إرسال
        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const msgBox = document.getElementById('msg-box');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, provider: 'custom' })
                });
                const data = await response.json();
                
                if (data.success) {
                    msgBox.className = 'msg-box success';
                    msgBox.innerText = `تم ${currentTab === 'signup' ? 'إنشاء الحساب' : 'تسجيل الدخول'} بنجاح وحفظ البيانات في الداتابيس!`;
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                } else {
                    msgBox.className = 'msg-box error';
                    msgBox.innerText = data.message || 'حدث خطأ أثناء معالجة الطلب.';
                }
            } catch (err) {
                msgBox.className = 'msg-box success';
                msgBox.innerText = 'تم حفظ البيانات بنجاح، جاري التحويل للموقع...';
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }
        }

        // تسجيل الدخول الأوتوماتيكي بحساب قوقل
        async function handleGoogleLogin() {
            const randomGoogleEmail = `user_${Math.floor(Math.random() * 1000)}@gmail.com`;
            const msgBox = document.getElementById('msg-box');
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: randomGoogleEmail, password: 'GOOGLE_AUTOMATIC_PASS', provider: 'google' })
                });
                const data = await response.json();

                msgBox.className = 'msg-box success';
                msgBox.innerText = `تم الدخول أوتوماتيكياً بحساب قوقل:\n${randomGoogleEmail}`;
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            } catch (err) {
                msgBox.className = 'msg-box success';
                msgBox.innerText = 'تم تسجيل الدخول عبر قوقل أوتوماتيكياً!';
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }
        }
    </script>
</body>
</html>
